<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>第一次打开 · 日迹</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="base.css">
</head>
<body>

<main class="empty">

  <div class="statusbar" aria-hidden="true">
    <span class="statusbar__time">7:10</span>
    <span class="statusbar__icons">
      <svg class="statusbar__icon" viewBox="0 0 16 16"><rect x="1" y="9" width="2.4" height="4" rx="1"/><rect x="4.6" y="7" width="2.4" height="6" rx="1"/><rect x="8.2" y="5" width="2.4" height="8" rx="1"/><rect x="11.8" y="3" width="2.4" height="10" rx="1"/></svg>
      <svg class="statusbar__icon" viewBox="0 0 16 16"><path d="M2 6.2a9 9 0 0 1 12 0" fill="none"/><path d="M4.4 8.8a5.6 5.6 0 0 1 7.2 0" fill="none"/><circle cx="8" cy="11.6" r="1.2" stroke="none"/></svg>
      <svg class="statusbar__icon" viewBox="0 0 16 16"><rect x="1" y="4.5" width="12" height="7" rx="2" fill="none"/><rect x="2.8" y="6.3" width="8.4" height="3.4" rx="1" stroke="none"/><path d="M14.6 7v2" fill="none"/></svg>
    </span>
  </div>

  <div class="empty__body">
    <svg class="empty__art" viewBox="0 0 168 168" role="img" aria-label="一枚尚未闭合的圆环，中间长出一株小芽">
      <circle class="seed__track" cx="84" cy="84" r="64"></circle>
      <path class="seed__arc" d="M133.3 43.2 A64 64 0 1 1 34.7 43.2"></path>
      <path class="seed__stem" d="M84 112V86"></path>
      <path class="seed__leaf" d="M84 96C76 96 71 90 71 84C79 84 84 89 84 96Z"></path>
      <path class="seed__leaf" d="M84 90C92 90 97 84 97 78C89 78 84 83 84 90Z"></path>
      <circle class="seed__dot" cx="84" cy="114" r="2.5"></circle>
    </svg>

    <h1 class="empty__title">先放下一件<br>小到不会失败的事。</h1>
    <p class="empty__text">两分钟也算。它不是任务，是你想成为的那种人的一个小动作。</p>

    <button class="btn-primary empty__action" type="button">选一件小事</button>

    <div class="empty__templates" role="group" aria-label="从一件小事开始">
      <button class="template-chip" type="button">读一页</button>
      <button class="template-chip" type="button">绕一圈</button>
      <button class="template-chip" type="button">早一点睡</button>
    </div>
  </div>

  <p class="empty__foot">数据只留在这台设备 · 不需要账号</p>

</main>

</body>
</html>
