<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今天 · 完成</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="base.css">
</head>
<body>

<svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5.5c3-1.2 5.4-1.2 8 0 2.6-1.2 5-1.2 8 0v13c-3-1.2-5.4-1.2-8 0-2.6-1.2-5-1.2-8 0v-13z"/><path d="M12 5.5v13"/></symbol>
  <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M5 19c0-8 6-13 14-13 0 8-5 14-13 14"/><path d="M5 19c3-5 7-8 11-10"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3l9 4.5-9 4.5-9-4.5L12 3z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5L12 21l9-4.5"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20v-8M10 20V5M16 20v-5M21 20H3"/></symbol>
  <symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.9 3.1-6.5 7-6.5s7 2.6 7 6.5"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M4.5 12.5l5 5 10-11"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h9a6 6 0 1 1 0 12h-3"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h15M14 6l6 6-6 6"/></symbol>
  <symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20l4.5-1 10-10a2.5 2.5 0 0 0-3.5-3.5l-10 10L4 20z"/><path d="M13.5 6.5l4 4"/></symbol>
</svg>

<main class="screen">

  <div class="statusbar" aria-hidden="true">
    <span class="statusbar__time">21:12</span>
    <span class="statusbar__icons">
      <svg class="statusbar__icon" viewBox="0 0 16 16"><rect x="1" y="9" width="2.4" height="4" rx="1"/><rect x="4.6" y="7" width="2.4" height="6" rx="1"/><rect x="8.2" y="5" width="2.4" height="8" rx="1"/><rect x="11.8" y="3" width="2.4" height="10" rx="1"/></svg>
      <svg class="statusbar__icon" viewBox="0 0 16 16"><path d="M2 6.2a9 9 0 0 1 12 0" fill="none"/><path d="M4.4 8.8a5.6 5.6 0 0 1 7.2 0" fill="none"/><circle cx="8" cy="11.6" r="1.2" stroke="none"/></svg>
      <svg class="statusbar__icon" viewBox="0 0 16 16"><rect x="1" y="4.5" width="12" height="7" rx="2" fill="none"/><rect x="2.8" y="6.3" width="8.4" height="3.4" rx="1" stroke="none"/><path d="M14.6 7v2" fill="none"/></svg>
    </span>
  </div>

  <header class="page-head">
    <p class="eyebrow">11月17日 · 周二</p>
    <h1 class="page-title">今天</h1>
    <p class="page-sub">三件小事，都落了地。</p>
  </header>

  <div class="celebrate" role="status" aria-live="polite">
    <div class="celebrate__body">
      <span class="celebrate__title">今天到这儿。</span>
      <span class="celebrate__sub">灯可以关了，明天见。</span>
    </div>
  </div>

  <section class="weekstrip" aria-label="最近七天记录">
    <div class="weekday"><span class="weekday__label">三</span><span class="weekday__date">11</span><span class="weekdot is-done"></span></div>
    <div class="weekday"><span class="weekday__label">四</span><span class="weekday__date">12</span><span class="weekdot is-done"></span></div>
    <div class="weekday"><span class="weekday__label">五</span><span class="weekday__date">13</span><span class="weekdot is-miss"></span></div>
    <div class="weekday"><span class="weekday__label">六</span><span class="weekday__date">14</span><span class="weekdot is-micro"></span></div>
    <div class="weekday"><span class="weekday__label">日</span><span class="weekday__date">15</span><span class="weekdot is-done"></span></div>
    <div class="weekday"><span class="weekday__label">一</span><span class="weekday__date">16</span><span class="weekdot is-done"></span></div>
    <div class="weekday is-today"><span class="weekday__label">二</span><span class="weekday__date">17</span><span class="weekdot is-done"></span></div>
  </section>

  <section class="hero-card" aria-labelledby="hero-name">

    <div class="hero-main">
      <div class="arc">
        <svg viewBox="0 0 148 148" role="img" aria-label="今天完成 3 件，共 3 件">
          <circle class="arc__track" cx="74" cy="74" r="68" pathLength="100"></circle>
          <circle class="arc__fill" cx="74" cy="74" r="68" pathLength="100" stroke-dasharray="100 100" transform="rotate(-90 74 74)"></circle>
          <line class="arc__tick" x1="74" y1="14" x2="74" y2="0"></line>
          <line class="arc__tick" x1="126" y1="104" x2="138.1" y2="111"></line>
          <line class="arc__tick" x1="22" y1="104" x2="9.9" y2="111"></line>
        </svg>
        <div class="arc__center" aria-hidden="true">
          <span class="arc__num">3<small>/3</small></span>
          <span class="arc__caption">今天</span>
        </div>
        <span class="arc__check" aria-hidden="true"><svg class="icon icon--sm"><use href="#i-check"/></svg></span>
      </div>

      <div class="hero-info">
        <div class="habit-id">
          <span class="icon-badge"><svg class="icon icon--md"><use href="#i-book"/></svg></span>
          <h2 class="hero-name" id="hero-name">晚读</h2>
        </div>
        <div class="meta-block">
          <span class="meta-label">触发</span>
          <p class="meta-text">洗完碗，水壶还热着</p>
        </div>
        <div class="meta-block">
          <span class="meta-label">近七天</span>
          <p class="meta-text meta-value">6 / 7 <span class="meta-text--muted">天</span></p>
        </div>
      </div>
    </div>

    <div class="done-row">
      <svg class="icon done-row__icon" aria-hidden="true"><use href="#i-check"/></svg>
      <span class="done-row__text">今天：简化版 · 5 分钟</span>
      <button class="btn-ghost" type="button">
        <svg class="icon icon--sm" aria-hidden="true"><use href="#i-undo"/></svg>
        改一下
      </button>
    </div>
  </section>

  <div class="section-head">
    <span class="section-title">另外两件</span>
    <span class="section-meta">今天都算数</span>
  </div>

  <section class="habit-list" aria-label="其他习惯">
    <button class="habit-row" type="button">
      <span class="mini-arc" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <circle class="mini-arc__track" cx="12" cy="12" r="10" pathLength="100"></circle>
          <circle class="mini-arc__fill" cx="12" cy="12" r="10" pathLength="100" stroke-dasharray="100 100" transform="rotate(-90 12 12)"></circle>
        </svg>
        <span class="mini-arc__check"><svg class="icon"><use href="#i-check"/></svg></span>
      </span>
      <span class="habit-row__body">
        <span class="habit-row__name">早起散步</span>
        <span class="habit-row__anchor">送完孩子，绕小区一圈</span>
      </span>
      <span class="habit-row__state">今天 · 完整</span>
    </button>

    <button class="habit-row" type="button">
      <span class="mini-arc mini-arc--3" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <circle class="mini-arc__track" cx="12" cy="12" r="10" pathLength="100"></circle>
          <circle class="mini-arc__fill" cx="12" cy="12" r="10" pathLength="100" stroke-dasharray="100 100" transform="rotate(-90 12 12)"></circle>
        </svg>
        <span class="mini-arc__check"><svg class="icon"><use href="#i-check"/></svg></span>
      </span>
      <span class="habit-row__body">
        <span class="habit-row__name">睡前静坐</span>
        <span class="habit-row__anchor">关灯前，坐三分钟</span>
      </span>
      <span class="habit-row__state">今天 · 微型</span>
    </button>
  </section>

  <section class="sensation" aria-labelledby="sensation-title">
    <div class="sensation__head">
      <div>
        <h3 class="sensation__title" id="sensation-title">身体怎么说？</h3>
        <p class="sensation__hint">一个词就够。想不到就跳过。</p>
      </div>
      <svg class="icon icon--md icon--muted" aria-hidden="true"><use href="#i-leaf"/></svg>
    </div>

    <div class="sensation__words" role="group" aria-label="选择今天的一个体感词">
      <button class="word-chip is-selected" type="button" aria-pressed="true">松<svg class="icon word-chip__check" aria-hidden="true"><use href="#i-check"/></svg></button>
      <button class="word-chip" type="button" aria-pressed="false">稳</button>
      <button class="word-chip" type="button" aria-pressed="false">累</button>
      <button class="word-chip" type="button" aria-pressed="false">亮</button>
      <button class="word-chip" type="button" aria-pressed="false">空</button>
      <button class="word-chip" type="button" aria-pressed="false">钝</button>
    </div>

    <div class="sensation__foot">
      <span class="sensation__note">今天：松</span>
      <button class="btn-ghost" type="button">
        <svg class="icon icon--sm" aria-hidden="true"><use href="#i-pen"/></svg>
        写一句
      </button>
    </div>
  </section>

</main>

<nav class="tabbar" aria-label="一级导航">
  <a class="tab is-active" href="#" aria-current="page"><svg class="icon" aria-hidden="true"><use href="#i-sun"/></svg><span>今天</span></a>
  <a class="tab" href="#"><svg class="icon" aria-hidden="true"><use href="#i-layers"/></svg><span>习惯</span></a>
  <a class="tab" href="#"><svg class="icon" aria-hidden="true"><use href="#i-chart"/></svg><span>回顾</span></a>
  <a class="tab" href="#"><svg class="icon" aria-hidden="true"><use href="#i-person"/></svg><span>我</span></a>
</nav>

</body>
</html>
